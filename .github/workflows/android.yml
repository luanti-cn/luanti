name: android

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext
    - name: Configure signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "No signing secrets configured; building unsigned artifacts."
          exit 0
        fi
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
        cat > android/local.properties <<EOF
        keystore=keystore.jks
        keystore.password=$ANDROID_KEYSTORE_PASSWORD
        key=$ANDROID_KEY_ALIAS
        key.password=$ANDROID_KEY_PASSWORD
        EOF
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
          distribution: 'temurin'
          java-version: '17'
    - name: Build AAB with Gradle
      # We build an AAB as well for uploading to the the Play Store.
      run: cd android; ./gradlew bundlerelease
    - name: Build APKs with Gradle
      # "assemblerelease" is very fast after "bundlerelease".
      run: cd android; ./gradlew assemblerelease
    - name: Save AAB artifact
      uses: actions/upload-artifact@v7
      with:
        name: LuantiCN-release.aab
        path: android/app/build/outputs/bundle/release/app-release.aab
    - name: Save armeabi artifact
      uses: actions/upload-artifact@v7
      with:
        name: LuantiCN-armeabi-v7a.apk
        path: android/app/build/outputs/apk/release/app-armeabi-v7a-release*.apk
    - name: Save arm64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: LuantiCN-arm64-v8a.apk
        path: android/app/build/outputs/apk/release/app-arm64-v8a-release*.apk
    - name: Save x86 artifact
      uses: actions/upload-artifact@v7
      with:
        name: LuantiCN-x86.apk
        path: android/app/build/outputs/apk/release/app-x86-release*.apk
    - name: Save x86_64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: LuantiCN-x86_64.apk
        path: android/app/build/outputs/apk/release/app-x86_64-release*.apk
